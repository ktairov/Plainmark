[package]
name = "plainmark"
version = "0.1.0"
description = "A lightweight desktop app for Markdown notes."
authors = ["Plainmark"]
edition = "2021"

[lib]
name = "plainmark_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
argon2 = "0.5"
base64 = "0.22"
chacha20poly1305 = "0.10"
filetime = "0.2.29"
notify = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-clipboard-manager = "2.3.3"
tauri-plugin-dialog = "2"
tauri-plugin-decorum = { git = "https://github.com/clearlysid/tauri-plugin-decorum.git", rev = "ea72a1f9d1f28f0ca6ea59fe5f6b5ab6c7293faf" }
tauri-plugin-opener = "2"
tauri-plugin-window-state = "2"
tempfile = "3.27.0"
trash = "5.2.9"
tree-sitter = "0.24"
tree-sitter-md = "0.3"
walkdir = "2"
zeroize = "1.8"

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
